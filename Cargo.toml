[package]
name = "linktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal instrument for the host's current network context"
license = "MIT"
publish = false

[dependencies]
ansi-to-html = "0.2"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
if-addrs = "0.15"
netmon-evidence = { git = "https://github.com/arclabs561/netmon.git", rev = "a54375f935515f709075e524aec51d74059523d1" }
netmon-replay = { git = "https://github.com/arclabs561/netmon.git", rev = "a54375f935515f709075e524aec51d74059523d1" }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wait-timeout = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
