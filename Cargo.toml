[package]
name = "linktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal instrument for the host's current network context"
license = "MIT"
publish = false

[dependencies]
ansi-to-html = "0.2"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
if-addrs = "0.15"
netbraid-evidence = { git = "https://github.com/arclabs561/netbraid.git", rev = "7f2add5e086aece8c78d5d3fba074c9cffb454a8" }
netbraid-replay = { git = "https://github.com/arclabs561/netbraid.git", rev = "7f2add5e086aece8c78d5d3fba074c9cffb454a8" }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
strip-ansi-escapes = "0.2.1"
wait-timeout = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
