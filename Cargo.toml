[package]
name = "linktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal instrument for the host's current network context"
license = "MIT"
repository = "https://github.com/arclabs561/linktop"
readme = "README.md"
publish = ["crates-io"]
keywords = ["diagnostics", "network", "observability", "tui", "wifi"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
ansi-to-html = "0.2"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
if-addrs = "0.15"
netbraid = { version = "0.3.0", default-features = false, features = ["scenario-fixtures"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
strip-ansi-escapes = "0.2.1"
wait-timeout = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
