name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo rustdoc --locked --lib -- -D warnings
      - name: Verify saved-evidence review contract
        run: |
          cargo build --locked --bin linktop
          python3 tests/review_campaign.py --self-test
          python3 tests/review_campaign.py --linktop target/debug/linktop
      - name: Verify bounded Netbraid feature surface
        run: |
          cargo metadata --locked --format-version 1 |
            jq -e '
              [.resolve.nodes[] as $node
                | .packages[]
                | select(.id == $node.id and .name == "netbraid")
                | $node.features] == [["scenario-fixtures"]]
            '
      - name: Verify crates.io package inventory
        run: |
          set -euo pipefail
          cargo package --locked --list >"$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx README.md "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx LICENSE "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx CHANGELOG.md "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx src/lib.rs "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx src/capture/fixtures/v1/qa_capture_manifest.json "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx src/output/fixtures/v1/snapshot.json "$RUNNER_TEMP/linktop-package.txt"
          grep -Fqx src/review/fixtures/positive-records.jsonl "$RUNNER_TEMP/linktop-package.txt"
          if grep -Eq '^(\.github/|AGENTS\.md$|docs/|justfile$)' "$RUNNER_TEMP/linktop-package.txt"; then
            echo "package contains repository-only files" >&2
            exit 1
          fi
          cargo package --locked
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')"
          cargo test --locked --manifest-path "target/package/linktop-${version}/Cargo.toml"
